      - 2. 呼吸系統整合: high-yield/respiratory.md
      - 3. 腎臟與泌尿系統整合: high-yield/renal.md
      - 4. 消化與肝膽胰整合: high-yield/gastrointestinal.md
      - 5. 神經科學與中樞整合: high-yield/neuroscience.md
      - 6. 內分泌與新陳代謝整合: high-yield/endocrine_metabolism.md
